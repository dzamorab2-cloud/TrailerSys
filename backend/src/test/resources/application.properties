# Configuracion usada solo por "mvn test": base de datos H2 embebida en modo
# compatible con PostgreSQL, para poder correr las pruebas sin necesitar un
# servidor PostgreSQL real. La aplicacion real sigue usando PostgreSQL
# (ver src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:trailersys;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

trailersys.jwt.secret=clave-secreta-de-pruebas-1234567890-abcdefgh
trailersys.jwt.expiration-minutes=60

# Mismo ajuste que src/main (ver ese archivo): sin el, una ruta inexistente
# no lanza NoHandlerFoundException y GlobalExceptionHandlerTest no puede
# verificar el 404 del hallazgo H-02.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# Respaldos: valores dummy - las pruebas no ejecutan pg_dump ni consultan
# "auditoria" (no existe en H2), solo configuracion/permisos/listado.
trailersys.respaldos.directorio=./target/backups-test
trailersys.respaldos.pg-dump=pg_dump
trailersys.respaldos.db-host=localhost
trailersys.respaldos.db-port=5432
trailersys.respaldos.db-nombre=trailersys
