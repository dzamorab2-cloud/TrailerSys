# =====================================================================
# Perfil de PRODUCCION. Se activa con SPRING_PROFILES_ACTIVE=prod (la
# imagen Docker ya lo trae activado). Todo lo sensible viene de variables
# de entorno SIN valor por defecto: si falta alguna, la aplicacion NO
# arranca (mejor eso que arrancar con una clave conocida).
# Guia completa: DESPLIEGUE.md en la raiz del repositorio.
# =====================================================================

# --- Base de datos ---------------------------------------------------
# DB_PARAMETROS sirve para bases administradas que exigen SSL, por ejemplo
# DB_PARAMETROS=?sslmode=require
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NOMBRE:trailersys}${DB_PARAMETROS:}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_PASSWORD}

# --- Seguridad ---------------------------------------------------------
# Minimo 32 caracteres aleatorios (ej.: openssl rand -base64 48).
trailersys.jwt.secret=${JWT_SECRET}
trailersys.jwt.expiration-minutes=${JWT_EXPIRACION_MINUTOS:480}
trailersys.cors.allowed-origins=${CORS_ORIGINS:}

# Sin cuentas ni datos demo. Administrador inicial (solo si no existe
# ninguno): ADMIN_USUARIO (por defecto "admin") + ADMIN_PASSWORD (min. 10).
trailersys.demo.sembrar=false
trailersys.admin-inicial.usuario=${ADMIN_USUARIO:admin}
trailersys.admin-inicial.password=${ADMIN_PASSWORD:}
trailersys.admin-inicial.correo=${ADMIN_CORREO:admin@trailersys.local}

# Sin paradas ni posiciones inventadas: el mapa muestra solo la ubicacion
# que reporta el conductor.
trailersys.simulacion.habilitada=${SIMULACION_HABILITADA:false}

# --- Frontend ------------------------------------------------------------
# El backend sirve tambien index.html, app.html, css/ y js/ (un solo
# dominio, sin CORS). La imagen Docker los copia a /app/frontend.
# En desarrollo la API no sirve estaticos (add-mappings=false en
# application.properties, hallazgo H-02); en produccion si.
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=file:${FRONTEND_DIR:/app/frontend}/
# Revalida siempre con el servidor para que un despliegue nuevo se vea
# de inmediato (sin quedarse con JS viejo en cache).
spring.web.resources.cache.cachecontrol.no-cache=true

# --- Servidor ------------------------------------------------------------
server.port=${PORT:8080}
# Detras de un proxy HTTPS (Caddy, Nginx, Render, Railway...).
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# --- Respaldos -------------------------------------------------------------
trailersys.respaldos.directorio=${BACKUPS_DIR:/app/backups}
trailersys.respaldos.pg-dump=${PG_DUMP_PATH:/usr/bin/pg_dump}
trailersys.respaldos.db-host=${DB_HOST}
trailersys.respaldos.db-port=${DB_PORT:5432}
trailersys.respaldos.db-nombre=${DB_NOMBRE:trailersys}

# --- Logs ------------------------------------------------------------------
logging.level.root=INFO
spring.jpa.show-sql=false
