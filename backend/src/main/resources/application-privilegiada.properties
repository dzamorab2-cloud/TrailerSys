# Perfil de verificacion para el hallazgo de seguridad "el backend se conecta
# como postgres" (ver Tabla 8 del articulo / roles_privilegios.txt). Apunta a
# una copia aislada de la base (trailersys_exp), nunca a la base en uso, con
# una cuenta de aplicacion sin privilegios de superusuario: trailersys_app,
# miembro del rol de grupo trailersys_administracion (DML completo en las 12
# tablas, sin DDL ni CREATE). Uso: mvnw spring-boot:run
# -Dspring-boot.run.profiles=privilegiada -DDB_PASSWORD_APP=...
spring.datasource.url=jdbc:postgresql://localhost:5432/trailersys_exp
spring.datasource.username=trailersys_app
spring.datasource.password=${DB_PASSWORD_APP}

# La copia ya tiene el esquema de la base en uso; esta cuenta no tiene
# permiso de DDL (ALTER/CREATE), asi que "update" fallaria en el arranque.
spring.jpa.hibernate.ddl-auto=validate
