spring.application.name=backend

# Configura tu conexion a PostgreSQL. Antes de arrancar, crea la base de datos:
#   CREATE DATABASE trailersys;
# La clave se recibe por DB_PASSWORD. El valor por defecto solo es para el
# entorno local documentado; en otros ambientes define siempre la variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trailersys}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" crea/ajusta las tablas automaticamente a partir de las entidades.
# Util mientras el modelo cambia; en produccion se reemplaza por migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Esta API no sirve recursos estaticos propios (el frontend va aparte). Sin
# esto, una ruta inexistente bajo un prefijo valido caia en el manejo por
# defecto de recursos estaticos de Spring Boot y terminaba en handleGeneric()
# devolviendo 500 (hallazgo H-02). Al desactivarlo y pedir que se lance la
# excepcion cuando no hay handler, GlobalExceptionHandler la traduce a 404.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# Clave para firmar los JWT. Sobrescribela con la variable de entorno JWT_SECRET en produccion;
# este valor por defecto solo sirve para desarrollo local.
trailersys.jwt.secret=${JWT_SECRET:cambia-este-valor-en-produccion-usa-una-clave-larga-y-aleatoria}
trailersys.jwt.expiration-minutes=480

# CORS: origenes que pueden llamar a la API desde OTRO dominio (separados
# por coma, admite comodines). En produccion el frontend lo sirve el propio
# backend (mismo origen), asi que normalmente no hace falta tocarlo.
trailersys.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,https://*.devtunnels.ms}

# Datos y cuentas demo (admin/admin1234, etc.). SOLO para desarrollo: el
# perfil "prod" lo apaga y crea un administrador inicial desde
# ADMIN_USUARIO / ADMIN_PASSWORD.
trailersys.demo.sembrar=${SEMBRAR_DEMO:true}

# Simulacion automatica del avance de los viajes (paradas automaticas y
# posicion estimada del vehiculo en el mapa). El perfil "prod" la apaga.
trailersys.simulacion.habilitada=${SIMULACION_HABILITADA:true}

# Respaldos de base de datos (modulo respaldo). El completo usa pg_dump real;
# el incremental exporta lo nuevo de la tabla auditoria. Ajusta la ruta de
# pg_dump.exe si tu instalacion de PostgreSQL esta en otro lugar.
trailersys.respaldos.directorio=${BACKUPS_DIR:./backups}
trailersys.respaldos.pg-dump=${PG_DUMP_PATH:C:/Program Files/PostgreSQL/18/bin/pg_dump.exe}
trailersys.respaldos.db-host=${DB_HOST:localhost}
trailersys.respaldos.db-port=${DB_PORT:5432}
trailersys.respaldos.db-nombre=${DB_NOMBRE:trailersys}
