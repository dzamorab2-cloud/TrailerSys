spring.application.name=backend

# Configura tu conexion a PostgreSQL. Antes de arrancar, crea la base de datos:
#   CREATE DATABASE trailersys;
# No se define spring.datasource.password a proposito: al no recibir password,
# el driver JDBC de PostgreSQL la busca automaticamente en el archivo pgpass
# (%APPDATA%\postgresql\pgpass.conf en Windows, ~/.pgpass en Linux/Mac), asi
# nunca queda escrita en este archivo (que si se sube a git).
spring.datasource.url=jdbc:postgresql://localhost:5432/trailersys
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" crea/ajusta las tablas automaticamente a partir de las entidades.
# Util mientras el modelo cambia; en produccion se reemplaza por migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Clave para firmar los JWT. Sobrescribela con la variable de entorno JWT_SECRET en produccion;
# este valor por defecto solo sirve para desarrollo local.
trailersys.jwt.secret=${JWT_SECRET:cambia-este-valor-en-produccion-usa-una-clave-larga-y-aleatoria}
trailersys.jwt.expiration-minutes=480
